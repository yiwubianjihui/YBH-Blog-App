# JVM 参数：Flutter 模板默认 -Xmx8G -XX:MaxMetaspaceSize=4G，那是给 32G+ 的 CI 机器用的。
# 在可用内存不足 8G 的开发机上，Gradle 守护进程会被系统直接杀掉，
# 现象是「只打印一行 "single-use Daemon process will be forked" 就 BUILD FAILED」，
# 排查起来毫无线索。压到 2G/768m 后同一台机器可稳定构建。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
