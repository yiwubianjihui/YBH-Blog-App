# JVM 参数：Flutter 模板默认 -Xmx8G -XX:MaxMetaspaceSize=4G，那是给 32G+ 的 CI 机器用的。
# 在可用内存不足 8G 的开发机上，Gradle 守护进程会被系统直接杀掉，
# 现象是「只打印一行 "single-use Daemon process will be forked" 就 BUILD FAILED」，
# 排查起来毫无线索。压到 2G/768m 后同一台机器可稳定构建。
# 2026-09-14 复测：R8 压缩阶段（:app:minifyReleaseWithR8）内存需求更高，
# 1.5G 堆会在最后一步被杀掉，故上调到 2560m —— 详见 tool/build_apk.ps1 开头。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
# Kotlin 编译**在本机必须跑在 Gradle 进程内**（2026-09-22 实测）：
# 默认策略会 fork 一个独立的 Kotlin 编译守护进程，而本机沙箱会在编译收尾时把它回收，
# 于是每个用到 KGP 的插件都报同一个错、构建在第 1 分钟就失败：
#     Execution failed for task ':xxx:compileReleaseKotlin'
#       > java.lang.Exception: Could not close incremental caches in build/xxx/kotlin/...
# 清掉缓存、停掉全部 Gradle 守护进程都无效（换一批插件接着报）。
# in-process 后同一个进程完成编译与收尾，缓存能正常关闭。
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
