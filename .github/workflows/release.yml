name: Release APK

# 推送 v* 标签时构建 split APK 并挂到对应 GitHub Release。
# 例：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build split APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 只有「标签版本号 == pubspec.yaml 里的 version」才构建。
      # 目的：历史版本归档（v0.0.5、v1.0.0 等）只是把旧产物挂到 GitHub 上，
      # 它们指向的提交是当时的 main，若不校验就会用当前代码重新打包并覆盖
      # 成同名 APK，产生「标着旧版本号、实际是新代码」的错误产物。
      - name: Verify tag matches pubspec version
        id: gate
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')
          echo "tag=$TAG pubspec=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag $TAG != pubspec version $VER — 跳过构建（历史版本归档不重新打包）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: steps.gate.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: flutter pub get

      - name: Restore signing key
        if: steps.gate.outputs.skip != 'true'
        # 签名密钥以 Secrets 形式托管（ANDROID_KEYSTORE_BASE64 等），
        # 在这里还原出仓库内被 .gitignore 排除的 key.properties 与 keystore，
        # 使 release 构建使用正式签名（与历史版本证书一致，可无缝升级）。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK will be debug-signed (fresh install only)"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/ybh-release.jks
          {
            echo "storePassword=$STORE_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=ybh-release.jks"
          } > android/key.properties
          ls -l android/app/ybh-release.jks android/key.properties

      - name: Build split APKs
        if: steps.gate.outputs.skip != 'true'
        run: flutter build apk --release --split-per-abi

      - name: Verify release signature
        # 若配置了签名密钥，校验 APK 证书与历史版本一致（CN=YBH Blog）。
        if: steps.gate.outputs.skip != 'true' && env.KS_SET == '1'
        env:
          KS_SET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          "$ANDROID_HOME/build-tools/"*/apksigner verify --print-certs \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -3

      - name: Collect artifacts
        if: steps.gate.outputs.skip != 'true'
        # 产物命名与官方下载站保持一致：YBH-blog-v<version>-<abi>.apk
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-//; s/-release$//')
            cp "$f" "dist/YBH-blog-v${VER}-${abi}.apk"
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt
          ls -l

      - name: Create GitHub Release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          overwrite: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
